name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -p "test_*.py"
# Firmware and Ghidra integration tests run locally with a contributor-owned ROM.
# Do not upload private ROMs, raw exports or Ghidra projects as Actions artifacts.
